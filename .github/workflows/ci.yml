name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Guardar el zip como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: aftv-short-url-zip
          path: dist/*.zip
          if-no-files-found: error
